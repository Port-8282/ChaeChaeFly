worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Docker DNS를 다시 조회해 재생성된 컨테이너의 IP를 따라간다.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;
    upstream front_service {
        zone front_service 64k;
        server front:8080 resolve;
    }
    upstream back_service {
        zone back_service 64k;
        server back:8080 resolve;
    }
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8080;
        server_name _;
        client_max_body_size 10m;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 60s;
        proxy_buffering off;

        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"service":"proxy","status":"ok"}';
        }
        # 공개하는 상태 경로는 이 한 개뿐이며 내부 상세 정보는 숨긴다.
        location = /api/health {
            proxy_pass http://back_service/actuator/health;
        }
        location = /api {
            proxy_pass http://back_service;
        }
        location ^~ /api/ {
            proxy_pass http://back_service;
        }
        location = /actuator { return 404; }
        location ^~ /actuator/ { return 404; }
        location / {
            proxy_pass http://front_service;
        }
    }
}
