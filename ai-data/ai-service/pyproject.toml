[project]
name = "port8282-ai"
version = "0.1.0"
description = "접안 계획 계산 및 최적화 서비스"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
