<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1490" viewBox="0 0 1600 1490" role="img" aria-labelledby="title desc"><title id="title">PORT 8282 ML 분리형 전체 인프라</title><desc id="desc">단일 레포와 Docker Compose를 유지한다. 앱 서버 안에는 proxy, front, back, ai, ml, db 여섯 컨테이너가 있다. Back이 이벤트와 상태를 저장하고 비동기 계산 작업을 관리한다. AI는 ML에 하역시간 예측을 요청하고 최적화와 규칙 계산을 수행한다. ML 학습은 별도 작업이며 이 ML 컨테이너는 검증된 모델로 추론만 한다. DB는 state_version, calculation_id, 모델 버전, 선택 당시의 결과와 사유인 선택 스냅샷을 보존하고 named volume에 저장한다. 외부 LLM API는 설명과 보고서에 사용한다. 배포 환경의 상세 제품은 미정인 설계안이다.</desc><defs>
<marker id="a-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#507a9c"/></marker>
<marker id="a-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#378271"/></marker>
<marker id="a-purple" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#8362a5"/></marker>
<marker id="a-orange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#b77c36"/></marker>
<marker id="a-gray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#7c8b98"/></marker>
<marker id="a-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#b16a68"/></marker>
