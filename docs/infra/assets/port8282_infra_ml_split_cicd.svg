<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600" role="img" aria-labelledby="title desc"><title id="title">PORT 8282 Jenkins CI/CD 및 ML 독립 배포</title><desc id="desc">코드 변경 또는 검증된 모델 출시 요청을 Jenkins Controller가 받아 Agent에게 작업을 배정한다. PR 검사에는 운영 자격증명을 제공하지 않는다. Agent는 의존성과 코드를 검사하고 이미지를 빌드해 모델 성능 및 AI와의 API 호환성을 검증한다. 릴리스에는 전체 여섯 서비스의 이미지 버전, 모델 해시와 전처리, Compose와 프록시 설정, DB 마이그레이션 버전을 기록한다. 코드와 모델 배포는 같은 배포 잠금을 사용한다. 배포 대상의 통과 이미지를 Registry에 저장하고 Jenkins가 SSH 명령으로 앱 서버의 Compose 갱신을 실행한다. DB 변경이 있으면 백업과 마이그레이션을 수행한다. 서버는 이미지를 pull하며 모델만 바뀌고 호환성이 유지되면 ML만 갱신한다. 배포나 검증 실패 시 DB 스키마 호환성을 확인하여 이전 앱 이미지 조합으로 복구하고 재검증한다. 모델 교체에는 신규 계산 대기 또는 전체 재시도 처리가 필요하다. 실제 파이프라인 구현과 검증은 아직 수행하지 않은 설계안이다.</desc><defs>
