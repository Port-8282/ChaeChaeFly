worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # Non-root workers need writable temporary paths.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"service":"front","status":"ok"}';
        }

        # The separate proxy service will route API requests to Back.
        # Missing API paths must not silently return the Vue index page.
        location = /api { return 404; }
        location ^~ /api/ { return 404; }
        location = /actuator { return 404; }
        location ^~ /actuator/ { return 404; }

        location /assets/ {
            try_files $uri =404;
        }

        # Support client-side routing when the dashboard adds Vue Router.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
